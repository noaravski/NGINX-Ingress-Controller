apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: 'nms-restricted-v2-scc'
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: true
allowPrivilegedContainer: false
allowedCapabilities:
  - NET_BIND_SERVICE
defaultAddCapabilities: null
fsGroup:
  type: MustRunAs
  ranges:
    - min: 101
      max: 101
    - min: 1000
      max: 1000
priority: null
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - ALL
runAsUser:
  type: MustRunAsRange
  uidRangeMin: 101
  uidRangeMax: 1000
seLinuxContext:
  type: MustRunAs
seccompProfiles:
  - runtime/default
supplementalGroups:
  type: RunAsAny
users: []
groups: []
volumes:
  - configMap
  - persistentVolumeClaim
  - projected
  - secret
